name: event_ticketers
description: "Event Ticketers - Aplikasi pemesanan tiket event."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.3
  image_picker: ^1.2.4
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  pdf: ^3.13.1
  printing: ^5.15.1
  table_calendar: ^3.2.0
  file_saver: ^0.7.0
  url_launcher: ^6.3.3
  http_parser: ^4.1.2
  image: ^4.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/videos/loading.mp4
    - assets/images/app_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 21